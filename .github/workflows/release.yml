name: Create Release with Custom Zip

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # dist/ is committed (tags must carry it for composer installs). Rebuild
      # anyway so the zip always matches the source, and warn if what was
      # committed had gone stale.
      - name: Build UI bundle
        run: |
          cd ui && npm ci && npm run build && cd ..
          git diff --quiet -- dist || echo "::warning::committed dist/ was stale — run 'cd ui && npm run build' and commit before tagging"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Create release zip
        run: |
          zip -r smschat.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x ".gitattributes" \
            -x "ui/*"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: smschat.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
