# Release: build the UI, then create the vX.Y.Z tag on a commit that INCLUDES
# dist/, so the GitHub release zip AND composer/Packagist installs of the tag
# both carry the bundle — while dist/ stays out of the main branch.
#
# Trigger: bump <version> in info.xml on main, then run this workflow
# (Actions → Release → Run workflow). The version is read from info.xml; the
# tag must not already exist.
name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from info.xml
        id: version
        run: |
          VERSION=$(sed -n 's:.*<version>\(.*\)</version>.*:\1:p' info.xml | head -n1)
          test -n "$VERSION" || { echo "No <version> in info.xml"; exit 1; }
          TAG="v$VERSION"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — bump info.xml first"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI bundle
        run: |
          cd ui
          npm ci
          npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader

      - name: Tag a release commit that includes dist/
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist
          git commit -m "Release $TAG (built assets)"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "refs/tags/$TAG"

      - name: Create release zip
        run: |
          zip -r smschat.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".gitignore" \
            -x "ui/*"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: smschat.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
